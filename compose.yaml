services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gradle_cache:/root/.gradle
  
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
  
  devcontainer:
    build:
      context: .
      dockerfile: ./.devcontainer/Dockerfile

    volumes:
      - ./:/workspace
      - gradle_cache:/root/.gradle

    command: sleep infinity
  
volumes:
  gradle_cache:
  frontend_node_modules: