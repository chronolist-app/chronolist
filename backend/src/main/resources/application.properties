spring.application.name=chronolist

# dev/testのみSQLによる初期化を有効にする
spring.sql.init.mode=never
spring.h2.console.enabled=false

# Session tables are managed by Flyway (prod) or schema.sql (dev/test).
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.max-age=${SESSION_COOKIE_MAX_AGE:${spring.session.timeout}}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# mybatisのログ表示設定
logging.level.org.mybatis=DEBUG
logging.level.org.mybatis.spring=DEBUG

# Spring Securityのユーザー名とパスワードを固定
## spring.security.user.name=admin
## spring.security.user.password=password

# mybatisのネーミングルールに従い, 変数名とヘッダー名を自動でマッピングする設定
mybatis.configuration.map-underscore-to-camel-case=true

mybatis.mapper-locations=classpath*:/com/magu1436/chronolist/*/mapper/*.xml
