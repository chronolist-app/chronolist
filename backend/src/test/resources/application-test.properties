spring.datasource.url=jdbc:h2:mem:chronolist-api-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=false
chronolist.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:sql/test-data.sql
